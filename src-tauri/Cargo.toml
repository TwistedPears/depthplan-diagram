[package]
name = "depthplan"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
rust-version = "1.94"
default-run = "depthplan"

[lib]
name = "depthplan_native"

[[bin]]
name = "depthplan"
path = "src/main.rs"

[[bin]]
name = "depthplan-mcp"
path = "src/bin/depthplan-mcp.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
automation = ["dep:tauri-plugin-wdio-webdriver", "dep:objc2"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.4.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = "0.4"
jsonschema = { version = "0.56", default-features = false }
libc = "0.2"
log = "0.4"

tempfile = "3"
base64 = "0.22"
same-file = "1"
png = "0.18.1"
