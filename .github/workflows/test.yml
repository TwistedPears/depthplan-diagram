name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Private development uses local hooks; retain an opt-in three-OS check.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - name: Windows private endpoint permissions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-acl.ps1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install native license generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Install native advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit native dependencies (including informational warnings)
        shell: bash
        run: cargo audit --file src-tauri/Cargo.lock --json | tee "$RUNNER_TEMP/cargo-audit.json"
      - name: Keep native audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-audit-${{ matrix.os }}
          path: ${{ runner.temp }}/cargo-audit.json
          if-no-files-found: warn
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-daemon
      - run: npm ci
      - run: npm audit
      - run: npm run format:check
      - run: npm run format:rust:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:hooks
      - run: node --test scripts/native-driver.test.mjs
      - run: npm test -- --runInBand
      - run: npm run test:native
      - run: npm run build:automation
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[],"resources":[]}}'
      - name: Tauri native integration
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        # Start the session bus after Xvfb so activated desktop services inherit DISPLAY.
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum dbus-run-session --' || '' }} npm run smoke:ci
      - name: Build uninstrumented native application
        run: npm run build
      - name: Verify release excludes automation
        shell: bash
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml -e normal > native-dependencies.txt
          if rg 'tauri-plugin-wdio' native-dependencies.txt; then exit 1; fi
      - name: Keep native test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/depthplan-tauri-smoke-*/*.png
          if-no-files-found: ignore
