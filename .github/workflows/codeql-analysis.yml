name: CodeQL
# Scan only when code lands on integration or release.
on:
  push:
    branches: [integration, release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # Private repositories require a paid GitHub Code Security plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
