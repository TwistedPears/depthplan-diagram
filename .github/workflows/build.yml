name: Build
# Packaging and installed-artifact acceptance run only for PRs into release.
on:
  pull_request:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Both Linux CPUs build and run natively, including their distribution artifacts.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    name: release (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Cached binaries and proc macros depend on the runner's system libraries.
          key: ${{ matrix.os }}
      - name: Install native license generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xvfb dbus-daemon openbox scrot xdotool xdg-utils desktop-file-utils libfile-mimeinfo-perl flatpak
      - run: npm ci
      - name: Package ordinary installed candidate
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run package -- --bundles ${{ runner.os == 'macOS' && 'dmg' || runner.os == 'Windows' && 'nsis' || 'appimage,deb' }}
      - name: Package Flatpak from the native Linux build
        if: runner.os == 'Linux'
        run: dbus-run-session -- npm run package:flatpak
      - name: Installed file associations and lifecycle
        timeout-minutes: 5
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum dbus-run-session --' || '' }} node scripts/installed-acceptance.mjs
      - name: Linux AppImage and Flatpak acceptance
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum dbus-run-session -- node scripts/installed-acceptance.mjs appimage
          xvfb-run --auto-servernum dbus-run-session -- node scripts/installed-acceptance.mjs flatpak
      - name: Keep installed artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/depthplan-installed/*.png
            ${{ runner.temp }}/depthplan-installed/report.json
            ${{ runner.temp }}/depthplan-installed/workspaces.json
            ${{ runner.temp }}/depthplan-installed-*/*.png
            ${{ runner.temp }}/depthplan-installed-*/report.json
            ${{ runner.temp }}/depthplan-installed-*/workspaces.json
          if-no-files-found: warn
      - name: Keep Linux distribution candidates
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-candidates-${{ runner.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.flatpak
      - name: Verify release excludes automation
        shell: bash
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml -e normal > native-dependencies.txt
          if rg 'tauri-plugin-wdio' native-dependencies.txt; then exit 1; fi
